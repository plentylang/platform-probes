name: Native ABI probes
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Check native host and record toolchain
        env:
          EXPECTED_HOST: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          rustc -vV | tee artifacts/toolchain.txt
          rustc -vV | grep -Fx "host: $EXPECTED_HOST"
          python -c 'import platform; print(platform.platform()); print(platform.machine())' | tee artifacts/host.txt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Generate, link, and execute native probe
        run: |
          set -o pipefail
          cargo run --locked -- artifacts 2>&1 | tee artifacts/probe.log
      - name: Preserve native objects and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probe-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: warn
